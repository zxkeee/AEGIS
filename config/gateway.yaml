# AEGIS — API Security Gateway Configuration

listen: ":8080"          # Gateway proxy port
admin_listen: ":8081"    # Admin API port
admin_auth: true
# admin_secret is intentionally blank here — set via environment variable:
#   export AEGIS_ADMIN_SECRET=$(openssl rand -hex 32)
# Never put a real secret in this file.
admin_secret: ""

# Console session settings. The browser console authenticates with the admin
# secret once, then uses an HttpOnly session cookie (not readable by JS) plus a
# CSRF token. The raw secret is never stored in the browser.
admin_session_ttl: 8h
# admin_cookie_insecure drops the Secure flag so the console works over plain
# HTTP locally. NEVER enable in production.
admin_cookie_insecure: false

# Optional CORS policy for the admin plane. When unset, the admin plane
# inherits security.cors. Set it when console origins differ from data-plane
# API origins — sharing one list lets every customer web-app origin make
# credentialed admin-API requests. Wildcard is rejected with admin_auth on.
# admin_cors:
#   enabled: true
#   allow_origins: ["https://console.example.com"]
#   allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
#   allow_headers: ["Content-Type", "Authorization", "X-CSRF-Token"]
#   max_age: 86400

# require_tls makes startup fail unless TLS is terminated at the gateway. Set it
# in production; leave false only when a trusted upstream terminates TLS.
require_tls: false

# shutdown_drain is the lame-duck grace on SIGTERM: /readyz flips to 503 (so the
# load balancer / k8s readiness probe drains this instance) while established
# connections keep being served, then in-flight requests finish and the gateway
# stops. Set it a few seconds above your LB's readiness probe period so rolling
# updates cause zero connection errors. 0 shuts down immediately (no grace).
shutdown_drain: 5s

# Trusted reverse-proxy IPs or CIDRs.
# Only connections from these addresses will have X-Forwarded-For trusted.
# List the EXACT IPs of your load balancers / ingress nodes — broad private
# ranges (10.0.0.0/8) allow anyone on the same network to spoof the client IP.
# Leave empty to always use the TCP RemoteAddr (safest default).
# Example: ["10.10.1.5/32", "10.10.1.6/32"]
trusted_proxies: []

tls:
  enabled: false
  cert_file: ""
  key_file: ""

redis:
  addr: "localhost:6379"
  # password is intentionally blank here — set via environment variable:
  #   export AEGIS_REDIS_PASSWORD=$(openssl rand -hex 24)
  password: ""
  db: 0
  # Sentinel HA mode: when master_name is set, `addr` above is ignored and the
  # gateway connects through the listed sentinels instead. See
  # docs/runbooks/ha.md.
  sentinel:
    master_name: ""        # e.g. "mymaster"
    addrs: []              # e.g. ["sentinel-1:26379","sentinel-2:26379","sentinel-3:26379"]
    sentinel_password: ""  # only when sentinels themselves require auth; via AEGIS_REDIS_SENTINEL_PASSWORD

logging:
  level: "info"
  format: "json"

# Outbound alerting for security events (BOLA/BFLA, IP blocks, etc.).
# webhook_url empty = alerts logged locally only. Set AEGIS_ALERT_WEBHOOK_URL
# to override the URL from the environment (keeps the secret out of the file).
alerting:
  webhook_url: ""          # https endpoint (Slack incoming webhook, PagerDuty, SIEM)
  format: "generic"        # "generic" (AEGIS envelope) or "slack" ({"text": ...})
  min_severity: "warning"  # deliver "warning"+ ; one of info|warning|critical

# Multi-tenancy (ADR-001, docs/design/multitenancy.md). Disabled = single
# "default" tenant (legacy). When enabled, every route needs a tenant_id and the
# tenant is resolved per request from the route (authoritative) and/or Host.
multitenancy:
  enabled: false
  # tenants:
  #   - id: acme
  #     name: "ACME Corp"
  #     hosts: ["acme.api.example"]
  #   - id: globex
  #     name: "Globex"
  #     hosts: ["globex.api.example"]
# routes (when multitenancy.enabled) must carry tenant_id, e.g.:
#   - path: /orders
#     tenant_id: acme
#     upstreams: ["http://orders.acme:8080"]

discovery:
  # Optional OpenAPI 3.x / Swagger 2.0 spec (YAML or JSON) used as the fallback
  # for documented-vs-observed drift detection. It applies to every tenant that
  # has not uploaded its own via PUT /api/discovery/spec. The catalog itself is
  # enabled by forensic_dsn (PostgreSQL); this only adds drift detection.
  # spec_path: ./openapi.yaml

security:
  rate_limit:
    enabled: true
    requests: 100
    window: 60s
    # When true, deny requests if Redis is unavailable instead of failing open.
    # Default false favours availability; set true for high-assurance deployments.
    fail_closed: false

  auth:
    enabled: false
    # secret is intentionally blank here — set via environment variable:
    #   export AEGIS_JWT_SECRET=$(openssl rand -hex 32)
    # Prefer jwks_url (RSA/ECDSA) over a shared secret for production.
    secret: ""
    issuer: ""
    audience: ""
    # identity_claim propagates an extra JWT claim as the caller's object-owner
    # identity (X-Gateway-Identity) for BOLA ownership detection when the resource
    # owner is not the subject. E.g. sub is an email but resources are owned by a
    # numeric id in claim "uid" and body field "user_id": set identity_claim "uid"
    # and abuse.owner_fields ["user_id"]. Empty = ownership compares against sub.
    identity_claim: ""
    # Deny requests when the JTI-revocation lookup fails (e.g. Redis outage).
    # false (default) fails open to preserve availability; true is the
    # high-assurance choice where a revoked token must never slip through.
    revocation_fail_closed: false
    # exclude matches on path-segment boundaries: "/public" excludes "/public"
    # and "/public/x" but NOT "/publicXYZ".
    exclude:
      - "/health"
      - "/public"

  waf:
    enabled: true
    ruleset_path: ""      # optional extra directives, included last (e.g. rule exclusions)
    block_mode: true
    # use_crs loads the full OWASP Core Rule Set v4 (~900 rules, anomaly scoring)
    # instead of the built-in starter rules. The built-in starter rules are
    # dev/demo-grade signature regexes, evadable by any competent attacker
    # (encoding tricks, whitespace, alternate syntax) — they exist so WAF has
    # SOME effect with zero setup, not as a production control. Set use_crs:
    # true for any real deployment (see charts/aegis/values.yaml, which
    # defaults to it). Roll out in monitor first (block_mode: false = detect
    # and log, no blocking), tune false positives via ruleset_path
    # (SecRuleRemoveById ...), then enforce.
    use_crs: false
    paranoia_level: 1     # 1-4: higher catches more, flags more benign traffic
    anomaly_threshold: 5  # inbound score at which CRS blocks (lower = stricter)

  bot:
    enabled: true
    blocked_ja3: []
    challenge_mode: false
    # Behind a TLS-terminating upstream (e.g. Cloudflare) the gateway can't see
    # the TLS ClientHello, so set these to consume the upstream's JA3 hash. Only
    # trusted from a peer in trusted_proxies. See docs/deploy/cloudflare.md.
    trust_upstream_ja3: false
    upstream_ja3_header: "Cf-Ja3-Hash"

  behavior:
    enabled: true
    score_threshold: 70
    window_seconds: 60

  ip_guard:
    enabled: true
    whitelist: []
    blacklist: []
    geo_block: []

  dlp:
    enabled: true
    patterns: []

  cors:
    enabled: true
    # List explicit origins — wildcard "*" is blocked when JWT auth is enabled.
    # Example: ["https://app.example.com", "https://admin.example.com"]
    allow_origins: []
    allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allow_headers: ["Content-Type", "Authorization"]
    max_age: 86400

  challenge:
    enabled: false
    ttl: 5m
    score_threshold: 50

  api_inventory:
    enabled: true
    alert_on_new: false

  threat_feed:
    enabled: false
    url: ""
    interval: 1h

  # Authorization-abuse detection (BOLA/BFLA). Runs after JWT auth using verified
  # identity/roles. Detect-only by default (records events without blocking).
  abuse:
    enabled: false
    enum_threshold: 50   # distinct object IDs per consumer/endpoint in window -> BOLA (enumeration)
    window: 60s
    block_mode: false    # true = deny flagged requests
    privileged: []       # BFLA rules, e.g.:
      # - path: "/admin/"
      #   required_roles: ["admin"]
    # Single-object BOLA / IDOR: flags a consumer that SUCCESSFULLY (2xx) reads an
    # object owned by someone else — the one-object leak enumeration cannot catch.
    # Detect-only (needs the response status to confirm the leak).
    object_ownership: false
    shared_object_threshold: 2    # objects with more distinct owners are treated as shared/public
    object_ownership_ttl: 168h    # how long an object's owner set is remembered (7 days)
    # owner_fields upgrades detection from heuristic (first-accessor) to CONFIRMED:
    # the response body is parsed for one of these JSON fields (top-level or under
    # a "data" wrapper) and its value is the object's true owner, compared to the
    # authenticated subject. Set these to the field(s) holding the caller's own id.
    owner_fields: []              # e.g. ["user_id", "owner_id", "account_id"]
    object_ownership_block: false # deny a KNOWN cross-owner access before forwarding (needs owner_fields)
    ownership_bypass_roles: []    # roles allowed to see others' objects, e.g. ["admin", "support"]

  # Positive-security schema enforcement: validate each request against the
  # documented OpenAPI/Swagger contract (discovery.spec_path) and reject what the
  # contract does not permit (missing/mistyped params, undocumented body fields).
  # Start in monitor mode to collect false positives, then flip block_mode.
  schema:
    enabled: false
    block_mode: false      # true = reject non-conforming requests with 422
    # max_body_bytes: 1048576  # body cap for validation (default 1 MiB)

registry:
  enabled: false  # EXPERIMENTAL, NOT YET WIRED — setting true fails config.Validate
  dsn: ""  # not yet wired up — see RegistryConfig's doc comment in internal/config/config.go
  cache_ttl_secs: 30
  rotation_days: 90

# Protected routes (reverse proxy targets)
#
# Per-route security overrides (require_auth / waf / dlp / rate_limit) are
# OPTIONAL. When omitted the global security.* settings apply. They feed the
# API Posture engine that classifies each endpoint as protected / partial /
# unprotected / shadow in the dashboard.
routes:
  - path: "/api/v1/"
    methods: ["GET", "POST", "PUT", "DELETE"]
    upstreams:
      - "http://localhost:3000"
    load_balance: "round_robin"
    timeout: "30s"
    retry_attempts: 2
    strip_prefix: false

  # Example: a fully protected sensitive route (overrides global settings).
  # - path: "/payments/"
  #   upstreams: ["http://payments:8080"]
  #   require_auth: true
  #   waf: true
  #   dlp: true
  #   rate_limit:
  #     enabled: true
  #     requests: 50
  #     window: 60s

  # Example: an internal, deliberately open route — shows up as "unprotected"
  # in the posture dashboard so the gap is visible.
  # - path: "/internal/"
  #   upstreams: ["http://internal:8080"]
  #   require_auth: false
  #   waf: false
  #   rate_limit:
  #     enabled: false

# ── API Discovery & Posture ──────────────────────────────────────────────────
# The passive API discovery catalog (endpoint inventory, posture, consumers,
# reporting) persists to PostgreSQL. Enable it by setting the forensic DSN:
#   export AEGIS_FORENSIC_DSN="postgres://user:pass@db-host:5432/aegis?sslmode=require"
# Use sslmode=require (or verify-full) in production; sslmode=disable is for local dev only.
# When unset the catalog is disabled and the Discovery middleware is a no-op.

# ── Console single sign-on (OIDC) ────────────────────────────────────────────
# Optional. Enables "Sign in with SSO" on the admin console via an external
# OpenID Connect provider (Okta, Auth0, Keycloak, Google, Azure AD, …). Runs the
# Authorization Code flow with PKCE, verifies the ID token, maps its claims to a
# tenant + role, and just-in-time provisions the operator. Requires admin_auth
# and forensic_dsn. Client credentials come from the environment:
#   export AEGIS_OIDC_CLIENT_ID=...
#   export AEGIS_OIDC_CLIENT_SECRET=...
# You MUST configure at least one access restriction (admin_roles,
# super_admin_roles, allowed_domains, or require_mapped_role) — otherwise every
# user in the identity provider could sign in to the console. Startup validation
# rejects an unrestricted SSO config.
# oidc:
#   enabled: true
#   issuer: "https://your-tenant.okta.com"        # HTTPS; its discovery doc is fetched at startup
#   client_id: ""                                  # via AEGIS_OIDC_CLIENT_ID
#   client_secret: ""                              # via AEGIS_OIDC_CLIENT_SECRET
#   redirect_url: "https://console.example.com/api/auth/oidc/callback"  # must end in this path
#   scopes: ["email", "profile", "groups"]         # "openid" is always added
#   roles_claim: "groups"                          # claim carrying group/role membership
#   admin_roles: ["aegis-admins"]                  # group values that grant the admin role
#   super_admin_roles: ["aegis-superadmins"]       # group values that grant cross-tenant super-admin
#   require_mapped_role: false                     # true = reject users matching no admin group (else viewer)
#   tenant_claim: ""                               # optional claim carrying the tenant id (empty => default)
#   allowed_domains: []                            # optional email-domain allowlist

# ── Data retention ───────────────────────────────────────────────────────────
# Optional. Bounds the growth of the durable PostgreSQL tables that would
# otherwise grow without limit: forensic_logs (one row per block), the admin
# audit log, and the consumer graph (api_consumers / api_endpoint_consumers).
# A background sweep deletes rows older than the per-table window. The endpoint
# catalog (api_endpoints) is intentionally NOT pruned. Needs forensic_dsn.
# retention:
#   enabled: true
#   interval: 24h              # how often the sweep runs (default 24h)
#   forensic_days: 90          # delete forensic_logs older than N days (0 = keep all)
#   audit_days: 365            # delete admin_audit_log older than N days (0 = keep all)
#   consumer_idle_days: 90     # delete consumers/edges not seen in N days (0 = keep all)
