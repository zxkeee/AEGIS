# Docker-compose config for local exploration. Differs from gateway.yaml only in
# what the containers need: Redis/Postgres are reached by service name, and the
# session cookie is allowed over plain HTTP (dev only). Secrets come from .env
# via the environment (AEGIS_ADMIN_SECRET, AEGIS_REDIS_PASSWORD, AEGIS_FORENSIC_DSN).
listen: ":8080"
admin_listen: ":8081"
admin_auth: true
admin_secret: "" # via AEGIS_ADMIN_SECRET
admin_cookie_insecure: true # DEV ONLY: console works over http://localhost
require_tls: false
shutdown_drain: 5s # lame-duck grace: /readyz -> 503, drain, then stop (zero-5xx rollouts)
trusted_proxies: []

tls:
  enabled: false

redis:
  addr: "redis:6379" # compose service name
  password: "" # via AEGIS_REDIS_PASSWORD

# forensic_dsn (catalog / posture / findings / consumers / audit / SSO / retention)
# is supplied by AEGIS_FORENSIC_DSN from the compose file → the bundled postgres.

logging:
  level: "info"
  format: "json"

security:
  rate_limit:
    enabled: true
    requests: 100
    window: 60s
  waf:
    enabled: true
    block_mode: true
  bot:
    enabled: true
  dlp:
    enabled: true
  ip_guard:
    enabled: true
  cors:
    enabled: true
    allow_origins: []
    allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allow_headers: ["Content-Type", "Authorization", "X-CSRF-Token"]
  api_inventory:
    enabled: true
  abuse:
    enabled: true
    enum_threshold: 20
    window: 120s

# A demo route so traffic to :8080 populates the discovery catalog. Point it at
# any reachable backend; httpbin echoes and 200s so the catalog fills quickly.
routes:
  - path: "/"
    methods: ["GET", "POST", "PUT", "DELETE"]
    upstreams:
      - "https://httpbingo.org"
    timeout: "15s"
