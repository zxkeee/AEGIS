# AEGIS Helm Values — Enterprise Defaults
# Override these per-environment (staging, production).

replicaCount: 2

image:
  repository: aegis/gateway
  tag: "2.1.0"
  # digest pins the exact image bytes, e.g.
  #   digest: "sha256:0f1e2d..."
  # A tag is a name and a name can be moved; a digest cannot. When set, the tag
  # is kept in the reference for readability and Kubernetes resolves by digest.
  # Empty means tag-only, which is fine for a development cluster and is not
  # what a production install should run.
  digest: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  # Gateway (data plane) — fine to publish externally.
  type: LoadBalancer
  gatewayPort: 8080
  # Admin plane (control plane) — deliberately a separate Service, defaulted
  # to ClusterIP. It must never face the public internet (same rule
  # docker-compose.yml enforces by binding 8081 to 127.0.0.1); expose it via
  # port-forward, a VPN-restricted Ingress, or an internal-only LoadBalancer
  # annotation, not by changing this to LoadBalancer/NodePort directly.
  adminType: ClusterIP
  adminPort: 8081

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: gateway.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Secret management.
# Option 1 (recommended): reference a pre-created K8s Secret.
#   kubectl create secret generic aegis-secrets \
#     --from-literal=admin-secret=$(openssl rand -hex 32)
# Option 2: let the chart create a secret (value must be set at deploy time).
#   helm install aegis . --set secrets.adminSecret=<value>
secrets:
  # Name of an existing K8s Secret containing all required keys:
  #   admin-secret, redis-password, jwt-secret (optional), forensic-dsn (optional),
  #   propagation-secret (optional), report-signing-key (optional),
  #   consumer-salt (optional), sentinel-password (optional),
  #   oidc-client-id (optional), oidc-client-secret (optional),
  #   alert-webhook-url (optional)
  # When set, the values below are ignored.
  existingSecret: ""
  # Direct values — only used if existingSecret is empty.
  # NEVER commit real values here; pass via --set or CI secret injection.
  # Example:
  #   helm install aegis . \
  #     --set secrets.adminSecret=$(openssl rand -hex 32) \
  #     --set secrets.redisPassword=$(openssl rand -hex 24) \
  #     --set secrets.jwtSecret=$(openssl rand -hex 32) \
  #     --set secrets.forensicDsn="postgres://user:pass@pg-host:5432/aegis?sslmode=require"
  adminSecret: ""
  redisPassword: ""
  jwtSecret: ""
  # forensicDsn is the ONLY supported way to set a credential-bearing Postgres
  # DSN — NEVER put a real value in gateway.forensic_dsn below; the ConfigMap
  # template force-blanks that field, so a value set there is silently
  # dropped at render time rather than reaching the gateway at all.
  forensicDsn: ""
  # propagationSecret is the HMAC key for X-Gateway-Signature (internal/config's
  # AEGIS_PROPAGATION_SECRET). Falls back to jwtSecret when unset — see
  # security.auth.propagation_secret in internal/config/config.go — so it's
  # optional for a single-gateway deployment but should be set explicitly once
  # backends verify the signature independently of the JWT secret.
  propagationSecret: ""
  # reportSigningKey is the Ed25519 key that attests compliance reports
  # (AEGIS_REPORT_SIGNING_KEY, see docs/compliance-evidence.md). Generate it with
  # `reportverify -genkey`. It MUST NOT be the license key or any other secret
  # here — config.Validate rejects reuse, because a shared key would let whoever
  # holds the other secret forge an audit report. Empty (the default) means
  # /api/report?sign=1 refuses rather than answering unsigned.
  reportSigningKey: ""
  # consumerSalt keys the pseudonymous consumer catalog (AEGIS_CONSUMER_SALT).
  # API keys and session ids come from small enough spaces that an unkeyed
  # digest could be searched back to a live credential by anyone who can read
  # the catalog, so the salt is what keeps the catalog irreversible.
  #
  # Nothing in this chart could set it before: the ConfigMap force-blanks
  # security.consumer_id.salt (it must never render into a plaintext ConfigMap)
  # and no environment variable was plumbed — so every Kubernetes deployment
  # silently fell back to deriving it from the admin secret. Whoever held that
  # secret could reverse the catalog, and rotating it renamed every consumer.
  consumerSalt: ""
  # rootEmail / rootPassword bootstrap the SUPER-ADMIN account on first boot
  # (AEGIS_ROOT_EMAIL / AEGIS_ROOT_PASSWORD). Neither was reachable from this
  # chart, so a Kubernetes install had no way to create a real account and the
  # operator's only entry was the bearer secret — the thing the bootstrap exists
  # to avoid. They take effect only when no users exist yet; afterwards they are
  # ignored, so leaving them set across upgrades is harmless.
  #
  # config.ValidateRootBootstrap refuses a weak or half-set pair and the gateway
  # will not start: this is the password of the account that owns every tenant.
  rootEmail: ""
  rootPassword: ""
  # sentinelPassword authenticates to Redis Sentinel when redis.sentinel is in
  # use (AEGIS_REDIS_SENTINEL_PASSWORD). Leave empty for a standalone Redis
  # (the default — see the redis sub-chart below).
  sentinelPassword: ""
  # oidcClientId / oidcClientSecret configure OIDC/SSO console login
  # (AEGIS_OIDC_CLIENT_ID / AEGIS_OIDC_CLIENT_SECRET, security.oidc.enabled).
  # Both empty (the default) means OIDC login is not configured — the
  # bootstrap secret / per-tenant password login paths still work.
  oidcClientId: ""
  oidcClientSecret: ""
  # alertWebhookUrl is the HTTPS endpoint alerts are POSTed to
  # (AEGIS_ALERT_WEBHOOK_URL). Routed through the Secret (not the ConfigMap)
  # because a Slack/Teams/etc. webhook URL carries its own bearer token in the
  # URL itself. Empty disables alerting.
  alertWebhookUrl: ""
  # splunkHecToken authenticates to a Splunk HTTP Event Collector, and
  # elasticApiKey to Elasticsearch, when alerting.sinks names one. Both are
  # write credentials to the customer's own security data store, which is why
  # they live here and never in the gateway config rendered into a ConfigMap.
  splunkHecToken: ""
  elasticApiKey: ""
  # ticketToken is the Jira API token or ServiceNow password used when
  # ticketing.enabled files incidents into a tracker. A write credential to the
  # customer's issue tracker, which is why it is here and never in the gateway
  # config rendered into a ConfigMap.
  ticketToken: ""

# Gateway configuration (injected as ConfigMap — no secrets here)
gateway:
  listen: ":8080"
  admin_listen: ":8081"
  admin_auth: true
  admin_secret: ""   # populated at runtime via AEGIS_ADMIN_SECRET env var
  # Always "" here — populated at runtime via AEGIS_FORENSIC_DSN (see
  # secrets.forensicDsn above). The ConfigMap template force-blanks this
  # field regardless of what's set here, so setting a real value in this
  # file directly would have no effect except leaking it into a plaintext
  # ConfigMap; use secrets.forensicDsn instead.
  forensic_dsn: ""
  # Path to a signed license file (internal/license, cmd/licensegen) — see
  # docs/licensing.md. Always "" here for the same reason as forensic_dsn
  # above (force-blanked by the ConfigMap template regardless); populate via
  # AEGIS_LICENSE_PATH. NOTE: this chart does not yet provide a mechanism to
  # mount a .lic file into the pod (no volume/Secret wiring for it) — that is
  # a deployment-capability gap to close separately, not a leak, since the
  # field stays correctly blanked either way.
  license_path: ""

  redis:
    addr: "aegis-redis:6379"
    # Always "" here — populated at runtime via AEGIS_REDIS_PASSWORD (see
    # secrets.redisPassword above); same force-blanked-in-ConfigMap treatment
    # as forensic_dsn.
    password: ""
    db: 0

  security:
    rate_limit:
      enabled: true
      requests: 100
      window: 60s
    waf:
      enabled: true
      block_mode: true
      # The built-in starter ruleset (use_crs: false) is dev/demo-grade —
      # simple signature regexes, evadable by any competent attacker. These
      # are "Enterprise Defaults": use the full OWASP Core Rule Set.
      # Roll out with block_mode: false first if this is a first deployment,
      # tune false positives (paranoia_level/anomaly_threshold), then enforce.
      use_crs: true
      paranoia_level: 1
      anomaly_threshold: 5
    bot:
      enabled: true
    behavior:
      enabled: true
      score_threshold: 70
      window_seconds: 60
    auth:
      enabled: false
      jwks_url: ""
      issuer: ""
      audience: ""
      secret: ""
    ip_guard:
      enabled: true
    dlp:
      enabled: true
    api_inventory:
      enabled: true
    cors:
      enabled: true
      # List explicit origins — never use ["*"] in production with JWT auth enabled.
      # Example: ["https://app.example.com"]
      allow_origins: []
      allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      allow_headers: ["Content-Type", "Authorization"]

  routes:
    - path: "/api/v1/"
      upstreams: ["http://backend-service:3000"]
      load_balance: "round_robin"
      timeout: "30s"
      retry_attempts: 2

# Redis sub-chart
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    # existingSecret must contain key "redis-password".
    # Points to the same secret created by this chart.
    existingSecret: ""        # filled in by deployment.yaml template logic
    existingSecretPasswordKey: redis-password
  resources:
    limits:
      cpu: 200m
      memory: 128Mi

# Restrict which pods can reach the admin plane at the network layer, on top
# of the Service-type restriction above (ClusterIP alone doesn't stop another
# pod anywhere in a flat cluster network from reaching it). Disabled by
# default because it requires a CNI that enforces NetworkPolicy (Calico,
# Cilium, etc.) — enable once you know your cluster supports it.
networkPolicy:
  enabled: false
  # Pods allowed to reach the admin Service (port 8081), scoped by label
  # within the SAME namespace as the release. WARNING: an empty podSelector
  # ({}) in a Kubernetes NetworkPolicy `from` clause matches ALL pods in the
  # namespace, not none — leaving both this and namespaceSelector unset when
  # networkPolicy.enabled is true is a fail-closed error at render time (see
  # networkpolicy.yaml), not a safe default. Set a real label, e.g.:
  #   podSelector:
  #     matchLabels:
  #       aegis-admin-client: "true"
  # (and label your operator/bastion/CI pods with it). Combine with
  # namespaceSelector below to also allow another namespace (e.g. an
  # operator/bastion namespace running kubectl port-forward or a VPN gateway).
  adminIngress:
    podSelector: {}
    # namespaceSelector: {}

# Pod disruption budget for HA
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Probes
livenessProbe:
  httpGet:
    path: /health
    port: admin
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /readyz
    port: admin
  initialDelaySeconds: 3
  periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}
