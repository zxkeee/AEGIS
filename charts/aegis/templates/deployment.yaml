apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        # Force rolling restart when config changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "aegis.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      # AEGIS never calls the Kubernetes API — don't hand a live cluster token
      # to a container that also terminates public-ish traffic.
      automountServiceAccountToken: false
      securityContext:
        # Pod-level seccompProfile: without it, the container gets the
        # container-runtime's own default, which on some cluster
        # configurations is Unconfined — a wider syscall surface than a Go
        # static binary needs. RuntimeDefault applies the runtime's curated
        # allowlist (available on all supported Kubernetes versions, 1.19+).
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/aegis/gateway.yaml"]
          env:
            {{- $secretName := .Values.secrets.existingSecret | default (printf "%s-secrets" (include "aegis.fullname" .)) }}
            - name: AEGIS_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: admin-secret
            - name: AEGIS_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: redis-password
            {{- if or .Values.secrets.jwtSecret .Values.secrets.existingSecret }}
            - name: AEGIS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: jwt-secret
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.forensicDsn .Values.secrets.existingSecret }}
            - name: AEGIS_FORENSIC_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: forensic-dsn
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.propagationSecret .Values.secrets.existingSecret }}
            - name: AEGIS_PROPAGATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: propagation-secret
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.reportSigningKey .Values.secrets.existingSecret }}
            - name: AEGIS_REPORT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: report-signing-key
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.consumerSalt .Values.secrets.existingSecret }}
            - name: AEGIS_CONSUMER_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: consumer-salt
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.rootEmail .Values.secrets.existingSecret }}
            - name: AEGIS_ROOT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: root-email
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.rootPassword .Values.secrets.existingSecret }}
            - name: AEGIS_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: root-password
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.sentinelPassword .Values.secrets.existingSecret }}
            - name: AEGIS_REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: sentinel-password
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.oidcClientId .Values.secrets.existingSecret }}
            - name: AEGIS_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: oidc-client-id
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.oidcClientSecret .Values.secrets.existingSecret }}
            - name: AEGIS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: oidc-client-secret
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.alertWebhookUrl .Values.secrets.existingSecret }}
            - name: AEGIS_ALERT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: alert-webhook-url
                  optional: true
            {{- end }}
          ports:
            - name: gateway
              containerPort: 8080
              protocol: TCP
            - name: admin
              containerPort: 8081
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/aegis
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: {{ include "aegis.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
