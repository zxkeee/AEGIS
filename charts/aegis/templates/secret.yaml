{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegis.fullname" . }}-secrets
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
type: Opaque
data:
  admin-secret: {{ required "secrets.adminSecret is required when secrets.existingSecret is not set" .Values.secrets.adminSecret | b64enc | quote }}
  redis-password: {{ required "secrets.redisPassword is required when secrets.existingSecret is not set" .Values.secrets.redisPassword | b64enc | quote }}
  {{- if .Values.secrets.jwtSecret }}
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.forensicDsn }}
  forensic-dsn: {{ .Values.secrets.forensicDsn | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.propagationSecret }}
  propagation-secret: {{ .Values.secrets.propagationSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.sentinelPassword }}
  sentinel-password: {{ .Values.secrets.sentinelPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.oidcClientId }}
  oidc-client-id: {{ .Values.secrets.oidcClientId | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.oidcClientSecret }}
  oidc-client-secret: {{ .Values.secrets.oidcClientSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.alertWebhookUrl }}
  alert-webhook-url: {{ .Values.secrets.alertWebhookUrl | b64enc | quote }}
  {{- end }}
{{- end }}
