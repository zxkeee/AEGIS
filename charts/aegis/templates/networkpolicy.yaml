# Default-deny ingress to the admin plane at the network layer. The Service
# split (service.yaml) already keeps it off a public LoadBalancer, but that
# alone doesn't stop another pod anywhere in a flat cluster network from
# reaching it — this closes that gap. Opt-in (networkPolicy.enabled) because
# it requires a CNI that enforces NetworkPolicy (Calico, Cilium, etc.).
{{- if .Values.networkPolicy.enabled }}
{{- if and (not .Values.networkPolicy.adminIngress.namespaceSelector) (not .Values.networkPolicy.adminIngress.podSelector) }}
{{- fail "networkPolicy.enabled is true but neither networkPolicy.adminIngress.podSelector nor .namespaceSelector is set. An empty podSelector in a Kubernetes NetworkPolicy `from` clause matches ALL pods in the namespace — the opposite of the default-deny this policy exists to provide. Set adminIngress.podSelector to a label real admin clients carry (e.g. {aegis-admin-client: \"true\"}), or adminIngress.namespaceSelector to scope by namespace instead." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis.fullname" . }}-admin
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegis.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Always allow the gateway (data-plane) port — untouched by this policy's
    # intent, which is scoping down the admin port specifically.
    - ports:
        - port: gateway
          protocol: TCP
    - ports:
        - port: admin
          protocol: TCP
      from:
        {{- with .Values.networkPolicy.adminIngress.namespaceSelector }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- with $.Values.networkPolicy.adminIngress.podSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- else }}
        - podSelector:
            {{- toYaml .Values.networkPolicy.adminIngress.podSelector | nindent 12 }}
        {{- end }}
{{- end }}
