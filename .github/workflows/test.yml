name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege: this workflow only builds/tests/uploads coverage, it never
# needs to write to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine@sha256:9702d01c1f10c3ea9f48211b4362e44f154ff02d063e6f7268eba804059f53bf
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      postgres:
        image: postgres:15-alpine@sha256:cae15a3b718f23497a60b7cafdcf205216d7949680972da0584db00fb68bf3e6
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -v -race -coverprofile=coverage.out
        env:
          REDIS_ADDR: localhost:6379
          POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/aegis?sslmode=disable

      # Coverage gate: fail if a critical package regresses below its floor.
      # Floors ratchet toward the >=70% release target (see the script).
      # Needs the same DB env as the test step so the integration tests (iam,
      # audit, discovery, api) run — otherwise they skip and the gate undercounts.
      - name: Coverage gate
        run: ./scripts/coverage-gate.sh
        env:
          REDIS_ADDR: localhost:6379
          POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/aegis?sslmode=disable

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          file: ./coverage.out
          flags: unittests

      # web/ is a separate Go module (its own go.mod) — go test ./... at the
      # repo root does not descend into it, so it needs its own step.
      - name: Test web/ module (marketing site)
        working-directory: web
        run: go test ./... -v -race
