name: Tests

on:
  push:
    branches: [main, develop]
  # No `branches:` filter here, deliberately. This key filters on the PR's BASE
  # branch, so a stacked PR — one opened against another feature branch rather
  # than main — matched nothing and ran zero checks. The first CI a stacked
  # change saw was the moment it was rebased onto main, which is the worst time
  # to discover it fails. Every PR is checked, whatever it targets.
  pull_request:

# Least privilege: this workflow only builds/tests/uploads coverage, it never
# needs to write to the repo.
# Один прогон на ветку и workflow. Более старые отменяются, а не ждут очереди.
#
# На одноразовых раннерах GitHub это экономия; на self-hosted это условие
# работоспособности: пятнадцать поставленных в очередь прогонов при одном
# исполнителе загнали домашний сервер в load average 12.88 на четырёх ядрах.
# Отменять устаревшее — единственный способ, при котором быстрый push подряд не
# превращается в часы молотьбы по коду, который уже никого не интересует.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine@sha256:9702d01c1f10c3ea9f48211b4362e44f154ff02d063e6f7268eba804059f53bf
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      postgres:
        image: postgres:15-alpine@sha256:cae15a3b718f23497a60b7cafdcf205216d7949680972da0584db00fb68bf3e6
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # An unprivileged role for the tests to connect as.
      #
      # A superuser — which is what the service container's `postgres` is —
      # ignores row-level security completely. Every tenant-isolation policy in
      # this repo was therefore inert for the whole test run, and a query that
      # forgot its tenant filter passed exactly like one that did not. Measured,
      # not assumed: two mutations that removed real protections in the seal
      # chain stayed green under `postgres` and went red immediately under a
      # role like this one.
      #
      # POSTGRES_DSN stays superuser because a few tests must CREATE ROLE to
      # build a restricted connection of their own. Those ask for it explicitly
      # (pgtest.AdminDSN); everything else gets POSTGRES_APP_DSN.
      - name: Create the unprivileged application role
        run: |
          psql "$POSTGRES_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          DROP ROLE IF EXISTS aegis_app;
          CREATE ROLE aegis_app LOGIN PASSWORD 'aegis_app' NOSUPERUSER NOBYPASSRLS;
          GRANT CREATE, CONNECT ON DATABASE aegis TO aegis_app;
          GRANT ALL ON SCHEMA public TO aegis_app;
          SQL
          # Fail the job rather than the assertions if the role is not what it
          # claims to be: a silently-privileged "unprivileged" role would put us
          # back where we started, with green checks that prove nothing.
          actual=$(psql "$POSTGRES_APP_DSN" -tAc \
            "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = current_user")
          if [ "$actual" != "f" ]; then
            echo "aegis_app bypasses RLS ($actual); the isolation tests would prove nothing"
            exit 1
          fi
        env:
          POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/aegis?sslmode=disable
          POSTGRES_APP_DSN: postgres://aegis_app:aegis_app@localhost:5432/aegis?sslmode=disable

      # -timeout 180s (default is 600s): a deadlocked test should report as a
      # failure, not as a ten-minute mystery. A cross-test goroutine leak once
      # hung internal/api for the full default window, and the job read as an
      # infrastructure problem rather than the test bug it was (2026-08-28).
      # The slowest package takes ~23s locally, so this leaves ample headroom
      # for a loaded runner while cutting the blind wait by a factor of three.
      - name: Run tests
        run: go test ./... -v -race -timeout 180s -coverprofile=coverage.out
        env:
          REDIS_ADDR: localhost:6379
          POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/aegis?sslmode=disable
          POSTGRES_APP_DSN: postgres://aegis_app:aegis_app@localhost:5432/aegis?sslmode=disable

      # Coverage gate: fail if a critical package regresses below its floor.
      # Floors ratchet toward the >=70% release target (see the script).
      # Needs the same DB env as the test step so the integration tests (iam,
      # audit, discovery, api) run — otherwise they skip and the gate undercounts.
      - name: Coverage gate
        run: ./scripts/coverage-gate.sh
        env:
          REDIS_ADDR: localhost:6379
          POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/aegis?sslmode=disable
          POSTGRES_APP_DSN: postgres://aegis_app:aegis_app@localhost:5432/aegis?sslmode=disable

      - name: Upload coverage
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          file: ./coverage.out
          flags: unittests

      # web/ is a separate Go module (its own go.mod) — go test ./... at the
      # repo root does not descend into it, so it needs its own step.
      - name: Test web/ module (marketing site)
        working-directory: web
        run: go test ./... -v -race -timeout 180s
