name: E2E Smoke

# End-to-end smoke test: boot the gateway against real Redis + PostgreSQL, drive
# traffic through it, and assert the passive discovery catalog and posture
# summary populate. This exercises the full request path plus the async catalog
# worker and the admin read API — not just unit-level behaviour.
#
# Validated end-to-end on a Linux Docker host before this workflow landed.

on:
  push:
    branches: [main, develop]
  # No `branches:` filter here, deliberately. This key filters on the PR's BASE
  # branch, so a stacked PR — one opened against another feature branch rather
  # than main — matched nothing and ran zero checks. The first CI a stacked
  # change saw was the moment it was rebased onto main, which is the worst time
  # to discover it fails. Every PR is checked, whatever it targets.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # internal/license (see docs/licensing.md) is a hard boot gate — the
      # gateway now refuses to start without a validly-signed license file.
      # Generates a THROWAWAY keypair for this CI run only (never a real
      # product key), embeds its public half into this build via -ldflags,
      # and issues a never-expiring internal license signed with the
      # matching private half — mirroring the real release-build/licensegen
      # flow docs/licensing.md describes, just fully automated and disposable.
      - name: Generate throwaway CI license key + license file
        run: |
          cat > /tmp/genkey.go <<'EOF'
          package main

          import (
          	"crypto/ed25519"
          	"encoding/base64"
          	"fmt"
          	"os"
          )

          func main() {
          	pub, priv, err := ed25519.GenerateKey(nil)
          	if err != nil {
          		panic(err)
          	}
          	if err := os.WriteFile("/tmp/ci-license.key", priv, 0o600); err != nil {
          		panic(err)
          	}
          	fmt.Print(base64.StdEncoding.EncodeToString(pub))
          }
          EOF
          PUB="$(go run /tmp/genkey.go)"
          echo "CI_LICENSE_PUBKEY=$PUB" >> "$GITHUB_ENV"
          go run ./cmd/licensegen -issue -key /tmp/ci-license.key \
            -licensee "CI (E2E Smoke)" -tier internal -days 0 \
            -out /tmp/ci-license.lic

      - name: Build gateway
        run: go build -ldflags "-X api-gateway/internal/license.publicKeyB64=$CI_LICENSE_PUBKEY" -o bin/gateway ./cmd/gateway

      - name: Start Redis (password-protected)
        run: |
          docker run -d --name aegis-e2e-redis -p 6379:6379 \
            redis:7-alpine@sha256:9702d01c1f10c3ea9f48211b4362e44f154ff02d063e6f7268eba804059f53bf redis-server --requirepass scanpass

      - name: Start PostgreSQL
        run: |
          docker run -d --name aegis-e2e-postgres -p 5432:5432 \
            -e POSTGRES_USER=aegis -e POSTGRES_PASSWORD=aegis -e POSTGRES_DB=aegis \
            postgres:15-alpine@sha256:cae15a3b718f23497a60b7cafdcf205216d7949680972da0584db00fb68bf3e6
          # Wait for the database to accept connections.
          for i in $(seq 1 30); do
            if docker exec aegis-e2e-postgres pg_isready -U aegis -q; then
              echo "postgres ready"; break
            fi
            sleep 1
          done

      - name: Start echo backend
        run: |
          docker run -d --name aegis-e2e-echo -p 3000:8080 \
            mendhak/http-https-echo:31@sha256:64208b871594c0eeb2a3c88736b6eb170dcb8edaa7a748c047f7fd62006e65ed

      - name: Launch AEGIS (catalog enabled)
        env:
          AEGIS_REDIS_PASSWORD: scanpass
          AEGIS_FORENSIC_DSN: postgres://aegis:aegis@127.0.0.1:5432/aegis?sslmode=disable
          AEGIS_LICENSE_PATH: /tmp/ci-license.lic
        run: |
          AEGIS_ADMIN_SECRET="$(openssl rand -hex 32)"
          echo "AEGIS_ADMIN_SECRET=$AEGIS_ADMIN_SECRET" >> "$GITHUB_ENV"
          AEGIS_ADMIN_SECRET="$AEGIS_ADMIN_SECRET" \
            ./bin/gateway --config tests/dynamic/gateway.e2e.yaml > gateway.log 2>&1 &
          echo "AEGIS_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8081/health; then
              echo "gateway healthy"; exit 0
            fi
            sleep 1
          done
          echo "gateway failed to become healthy"; cat gateway.log; exit 1

      - name: Drive traffic
        run: |
          for p in /api/v1/users/1 /api/v1/users/2 /api/v1/users/3 \
                   /api/v1/orders/10 /api/v1/orders/11 /api/v1/products /health; do
            curl -fsS -o /dev/null "http://127.0.0.1:8080$p" || true
          done
          # The catalog worker flushes its window to PostgreSQL every 5s.
          sleep 8

      - name: Assert catalog and posture populate
        run: |
          AUTH="Authorization: Bearer $AEGIS_ADMIN_SECRET"
          catalog="$(curl -fsS -H "$AUTH" http://127.0.0.1:8081/api/catalog)"
          posture="$(curl -fsS -H "$AUTH" http://127.0.0.1:8081/api/posture/summary)"
          echo "catalog: $catalog"
          echo "posture: $posture"
          python3 - "$catalog" "$posture" <<'PY'
          import json, sys
          catalog = json.loads(sys.argv[1])
          posture = json.loads(sys.argv[2])
          count = catalog.get("count", 0)
          total = posture.get("total", 0)
          if count < 1:
              print(f"FAIL: catalog is empty (count={count})"); sys.exit(1)
          if total < 1:
              print(f"FAIL: posture summary is empty (total={total})"); sys.exit(1)
          # Paths must be normalised (e.g. /api/v1/users/{id}).
          templates = [e.get("path_template", "") for e in catalog.get("endpoints", [])]
          if not any("{id}" in t for t in templates):
              print(f"FAIL: no normalised {{id}} endpoint in {templates}"); sys.exit(1)
          print(f"OK: catalog count={count}, posture total={total}, templates={templates}")
          PY

      - name: Gateway logs (always)
        if: always()
        run: cat gateway.log || true

      - name: Teardown
        if: always()
        run: |
          [ -n "${AEGIS_PID:-}" ] && kill "$AEGIS_PID" 2>/dev/null || true
          docker rm -f aegis-e2e-redis aegis-e2e-postgres aegis-e2e-echo 2>/dev/null || true
