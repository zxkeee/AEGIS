name: Lint

on:
  push:
    branches: [main, develop]
  # No `branches:` filter here, deliberately. This key filters on the PR's BASE
  # branch, so a stacked PR — one opened against another feature branch rather
  # than main — matched nothing and ran zero checks. The first CI a stacked
  # change saw was the moment it was rebased onto main, which is the worst time
  # to discover it fails. Every PR is checked, whatever it targets.
  pull_request:

# Один прогон на ветку и workflow. Более старые отменяются, а не ждут очереди.
#
# На одноразовых раннерах GitHub это экономия; на self-hosted это условие
# работоспособности: пятнадцать поставленных в очередь прогонов при одном
# исполнителе загнали домашний сервер в load average 12.88 на четырёх ядрах.
# Отменять устаревшее — единственный способ, при котором быстрый push подряд не
# превращается в часы молотьбы по коду, который уже никого не интересует.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-handoff.py compares the document against merge commits, and
          # the default shallow clone has none. It would then report "skipped
          # (no merge history available)" and pass — green for the reason this
          # repository has been burned by more than once.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Install golangci-lint from source so it is built with the same Go
      # toolchain as the project (go.mod). The prebuilt action binaries lag
      # behind and refuse to load a module whose go directive is newer than the
      # Go version they were compiled with. Pinned to a specific release (not
      # @latest) so a compromised/broken upstream release can't silently start
      # running in CI — bump deliberately, same discipline as the Go toolchain
      # pin in go.mod.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        run: golangci-lint run --timeout 5m ./...

      # web/ is a separate Go module (its own go.mod) — the run above does not
      # descend into it.
      - name: Run golangci-lint (web/ module)
        working-directory: web
        run: golangci-lint run --timeout 5m ./...

      # Guard against accidentally committing compiled artifacts (e.g. the 8 MB
      # loadgen binary that once sat untracked in the repo root).
      - name: Check for committed binaries
        run: ./scripts/check-no-binaries.sh

      # Security invariants a general linter cannot express (each encodes a bug
      # we shipped and fixed): no raw path-prefix matching, all forwarded
      # identity headers are covered by the signature payload.
      - name: Check security invariants
        run: ./scripts/lint-invariants.sh

      # helm is preinstalled on the GitHub-hosted ubuntu-latest runner image
      # (see actions/runner-images' included software list) — no separate
      # setup-helm action/install step needed. Catches template errors (e.g.
      # the configmap.yaml deepCopy/set logic added for the redis.password /
      # forensic_dsn ConfigMap-leak fix) that nothing else in this repo checks.
      - name: helm lint
        run: helm lint charts/aegis

      # Keeps the docker-compose.yml digest-pinning TODOs (prometheus/grafana)
      # from growing unnoticed, and catches a newly added tag-only image.
      - name: Check container image pinning
        run: ./scripts/check-image-pins.sh

      # The support bundle leaves the customer's network by design, so what it
      # carries is a security property. Canaries rather than review: the same
      # method that settled the ConfigMap leak, after three separate arguments
      # concluded that leak was impossible while it was shipping.
      - name: The support bundle must not carry secrets
        run: ./scripts/check-support-bundle.sh

      # The documents describing this product drifted apart from the code four
      # times in one session — README carried no mention of mirror mode, seals,
      # NIS2 or DORA while the sales offer led with the first; the roadmap and
      # the release checklist both listed the mirror as unstarted work after it
      # had shipped. Every one was caught by a person reading two files side by
      # side, which is not a control. This is.
      - name: Check docs against the code
        run: python3 ./scripts/check-doc-drift.py

      # doc-drift checks that a capability is MENTIONED; its own docstring says
      # it cannot tell whether the sentence is true, and a wrong one passes. The
      # deep-dive architecture document, written for investors and grant
      # assessors, listed five environment variables the gateway does not read —
      # in the deployment section, the one somebody follows live. This checks
      # the facts that have exactly one right answer.
      - name: Check documented facts against the code
        run: python3 ./scripts/check-doc-facts.py

      # The site is English; Polish and Ukrainian are translations. A key the
      # translation lacks renders as English at runtime with no warning, so a
      # translated page can rot back into English one string at a time and
      # anybody reviewing in English would see nothing wrong.
      - name: Check translations against the English source
        run: node ./scripts/check-i18n.mjs

      # Same class, different reader. doc-drift watches what a buyer reads;
      # handoff.md is what the next session reads before touching anything, and
      # it is the file that drifted furthest — describing main as of #71 while
      # main carried #79. Needs full history: the check compares against merge
      # commits, and a shallow clone has none.
      - name: Check handoff against the merge history
        run: python3 ./scripts/check-handoff.py

      # A duplicated planning row is two rows disagreeing about one subject,
      # and a reader believes whichever they read first. Both instances so far
      # came from a batch of document edits where one replacement failed and
      # the script exited before writing — so the author believed all of them
      # had landed. Prose could not stop the second one; this can.
      - name: Planning tables must not list the same thing twice
        run: python3 ./scripts/check-plan-tables.py

  # The console bundle is committed so `go build` works without Node. Nothing
  # checked that the committed bytes were built from the committed lockfile, so
  # a dependency bump could change the console's inputs while the embedded
  # bundle silently stayed as it was — and every npm update passed CI on that
  # basis.
  #
  # This could not be checked before: sequential asset names made a no-op
  # rebuild rewrite 58 files, so a diff meant nothing. With content-hashed
  # assets a rebuild is byte-identical, and a diff means exactly one thing.
  console-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/console/package-lock.json

      - name: Rebuild the console
        working-directory: web/console
        run: |
          npm ci
          npm run build

      - name: The committed bundle must match the lockfile
        run: |
          if ! git diff --exit-code --stat internal/api/console_dist/; then
            echo "::error::internal/api/console_dist/ is not what the committed"
            echo "::error::package-lock.json builds. Run 'make console' and commit"
            echo "::error::the result, so the binary ships the console its"
            echo "::error::dependencies describe."
            exit 1
          fi

  # web/v3 is the marketing site. Until now CI only ran `npm audit` against it,
  # so nothing ever built it — and a dependency bump that makes it uninstallable
  # passed every check.
  #
  # That is not hypothetical. Two Dependabot PRs were green on this repository
  # while `npm ci` failed outright: react-dom 19 against react 18 (#47), and
  # @vitejs/plugin-react 6 requiring vite 8 against vite 6 (#48). Both were
  # caught by hand. The next one would not have been.
  #
  # No artifact is kept: the site is deployed separately. The question this job
  # answers is only "does it still install and build", which is the question the
  # audit-only setup could not ask.
  site-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/v3/package-lock.json

      # `npm ci` is the check, not a preamble to it: a peer-dependency conflict
      # fails here, which is how both of the PRs above should have failed.
      - name: Install and build
        working-directory: web/v3
        run: |
          npm ci
          npm run build
