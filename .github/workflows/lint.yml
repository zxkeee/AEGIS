name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # Install golangci-lint from source so it is built with the same Go
      # toolchain as the project (go.mod). The prebuilt action binaries lag
      # behind and refuse to load a module whose go directive is newer than the
      # Go version they were compiled with. Pinned to a specific release (not
      # @latest) so a compromised/broken upstream release can't silently start
      # running in CI — bump deliberately, same discipline as the Go toolchain
      # pin in go.mod.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        run: golangci-lint run --timeout 5m ./...

      # web/ is a separate Go module (its own go.mod) — the run above does not
      # descend into it.
      - name: Run golangci-lint (web/ module)
        working-directory: web
        run: golangci-lint run --timeout 5m ./...

      # Guard against accidentally committing compiled artifacts (e.g. the 8 MB
      # loadgen binary that once sat untracked in the repo root).
      - name: Check for committed binaries
        run: ./scripts/check-no-binaries.sh

      # Security invariants a general linter cannot express (each encodes a bug
      # we shipped and fixed): no raw path-prefix matching, all forwarded
      # identity headers are covered by the signature payload.
      - name: Check security invariants
        run: ./scripts/lint-invariants.sh

      # helm is preinstalled on the GitHub-hosted ubuntu-latest runner image
      # (see actions/runner-images' included software list) — no separate
      # setup-helm action/install step needed. Catches template errors (e.g.
      # the configmap.yaml deepCopy/set logic added for the redis.password /
      # forensic_dsn ConfigMap-leak fix) that nothing else in this repo checks.
      - name: helm lint
        run: helm lint charts/aegis

      # Keeps the docker-compose.yml digest-pinning TODOs (prometheus/grafana)
      # from growing unnoticed, and catches a newly added tag-only image.
      - name: Check container image pinning
        run: ./scripts/check-image-pins.sh
