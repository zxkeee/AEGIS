name: Security

on:
  push:
    branches: [main, develop]
  # No `branches:` filter here, deliberately. This key filters on the PR's BASE
  # branch, so a stacked PR — one opened against another feature branch rather
  # than main — matched nothing and ran zero checks. The first CI a stacked
  # change saw was the moment it was rebased onto main, which is the worst time
  # to discover it fails. Every PR is checked, whatever it targets.
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # Install gosec from source so it runs under the project's Go toolchain
      # (go.mod). The Docker-based action bundles an older Go that cannot load a
      # module whose go directive is newer. Pinned to a specific release (not
      # @latest) so a compromised/broken upstream release can't silently start
      # running in CI — bump deliberately.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      # -severity medium filters out low-severity noise (e.g. G104 unhandled
      # errors on deferred Close()); medium/high findings still fail the build.
      - name: Run gosec
        run: gosec -severity medium ./...

      # web/ is a separate Go module (its own go.mod) — the run above does not
      # descend into it, and it now has security-relevant code (SMTP header
      # construction, rate limiting) worth covering.
      - name: Run gosec (web/ module)
        working-directory: web
        run: gosec -severity medium ./...

      # Scan dependencies and the standard library for known CVEs. Uses the Go
      # toolchain pinned in go.mod (auto-downloaded) so the stdlib version matches
      # production. Pinned to a specific release (not @latest) for the same
      # supply-chain reason as golangci-lint/gosec above.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        run: govulncheck ./...
        env:
          GOTOOLCHAIN: auto

      - name: Run govulncheck (web/ module)
        working-directory: web
        run: govulncheck ./...
        env:
          GOTOOLCHAIN: auto

      # Frontend dependency trees (console admin UI + marketing site) were
      # previously never scanned by CI at all — only the Go modules were.
      # `npm audit` reads package-lock.json directly, no install needed.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Audit npm dependencies (console)
        working-directory: web/console
        run: npm audit --audit-level=high

      - name: Audit npm dependencies (marketing site)
        working-directory: web/v3
        run: npm audit --audit-level=high
