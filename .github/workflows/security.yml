name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: ./...

      - name: Dependabot (automated)
        # This runs automatically via GitHub Actions
        # Just ensuring it's enabled in repository settings
        run: echo "Dependabot checks are enabled"
