name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Install gosec from source so it runs under the project's Go toolchain
      # (go.mod). The Docker-based action bundles an older Go that cannot load a
      # module whose go directive is newer.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      # -severity medium filters out low-severity noise (e.g. G104 unhandled
      # errors on deferred Close()); medium/high findings still fail the build.
      - name: Run gosec
        run: gosec -severity medium ./...

      # Scan dependencies and the standard library for known CVEs. Uses the Go
      # toolchain pinned in go.mod (auto-downloaded) so the stdlib version matches
      # production.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
        env:
          GOTOOLCHAIN: auto
