name: Dynamic Security Scan

# Boots a self-contained AEGIS instance and runs automated dynamic security
# testing against it (RELEASE-CHECKLIST "Independent security testing"):
#   1. tests/pentest.sh   — WAF efficacy + admin-auth smoke (deterministic).
#   2. nuclei             — templated scan of the AEGIS *admin* plane.
#
# The scan targets the admin plane because that is AEGIS's own HTTP surface; the
# data plane proxies to a disposable echo backend, so exposure templates would
# false-positive there. The data plane's WAF is covered deterministically by
# pentest.sh (payloads are denied with 403 before they ever reach a backend).
#
# Validated end-to-end on a Linux/amd64 Docker host before this workflow landed.

on:
  push:
    branches: [main, develop]
  # No `branches:` filter here, deliberately. This key filters on the PR's BASE
  # branch, so a stacked PR — one opened against another feature branch rather
  # than main — matched nothing and ran zero checks. The first CI a stacked
  # change saw was the moment it was rebased onto main, which is the worst time
  # to discover it fails. Every PR is checked, whatever it targets.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamic-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # internal/license (see docs/licensing.md) is a hard boot gate — the
      # gateway now refuses to start without a validly-signed license file.
      # Generates a THROWAWAY keypair for this CI run only (never a real
      # product key), embeds its public half into this build via -ldflags,
      # and issues a never-expiring internal license signed with the
      # matching private half — mirroring the real release-build/licensegen
      # flow docs/licensing.md describes, just fully automated and disposable.
      - name: Generate throwaway CI license key + license file
        run: |
          cat > /tmp/genkey.go <<'EOF'
          package main

          import (
          	"crypto/ed25519"
          	"encoding/base64"
          	"fmt"
          	"os"
          )

          func main() {
          	pub, priv, err := ed25519.GenerateKey(nil)
          	if err != nil {
          		panic(err)
          	}
          	if err := os.WriteFile("/tmp/ci-license.key", priv, 0o600); err != nil {
          		panic(err)
          	}
          	fmt.Print(base64.StdEncoding.EncodeToString(pub))
          }
          EOF
          PUB="$(go run /tmp/genkey.go)"
          echo "CI_LICENSE_PUBKEY=$PUB" >> "$GITHUB_ENV"
          go run ./cmd/licensegen -issue -key /tmp/ci-license.key \
            -licensee "CI (Dynamic Security Scan)" -tier internal -days 0 \
            -out /tmp/ci-license.lic

      - name: Build gateway
        run: go build -ldflags "-X api-gateway/internal/license.publicKeyB64=$CI_LICENSE_PUBKEY" -o bin/gateway ./cmd/gateway

      # Redis must carry a password — config.Validate rejects an empty one. The
      # official image takes it via --requirepass.
      - name: Start Redis (password-protected)
        run: |
          docker run -d --name aegis-scan-redis -p 6379:6379 \
            redis:7-alpine@sha256:9702d01c1f10c3ea9f48211b4362e44f154ff02d063e6f7268eba804059f53bf redis-server --requirepass scanpass

      # Disposable upstream so the proxy has somewhere to forward to.
      - name: Start echo backend
        run: |
          docker run -d --name aegis-scan-echo -p 3000:8080 \
            mendhak/http-https-echo:31@sha256:64208b871594c0eeb2a3c88736b6eb170dcb8edaa7a748c047f7fd62006e65ed

      - name: Launch AEGIS
        env:
          AEGIS_REDIS_PASSWORD: scanpass
          AEGIS_LICENSE_PATH: /tmp/ci-license.lic
        run: |
          # Strong admin secret (config.Validate rejects placeholders/short keys).
          AEGIS_ADMIN_SECRET="$(openssl rand -hex 32)"
          echo "AEGIS_ADMIN_SECRET=$AEGIS_ADMIN_SECRET" >> "$GITHUB_ENV"
          AEGIS_ADMIN_SECRET="$AEGIS_ADMIN_SECRET" \
            ./bin/gateway --config tests/dynamic/gateway.ci.yaml > gateway.log 2>&1 &
          echo "AEGIS_PID=$!" >> "$GITHUB_ENV"
          # Wait for readiness (max ~30s).
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8081/health; then
              echo "gateway healthy"; exit 0
            fi
            sleep 1
          done
          echo "gateway failed to become healthy"; cat gateway.log; exit 1

      - name: WAF + auth smoke (pentest.sh)
        run: bash tests/pentest.sh http://127.0.0.1:8080 http://127.0.0.1:8081

      - name: nuclei scan (admin plane)
        run: |
          # Build -eid args from the allowlist (skip comments / blank lines).
          EID_ARGS=()
          while IFS= read -r line; do
            id="${line%%#*}"; id="$(echo "$id" | xargs)"
            [ -n "$id" ] && EID_ARGS+=( -eid "$id" )
          done < tests/dynamic/nuclei-ignore.txt

          # Digest resolved via the registry API (no local Docker daemon needed):
          #   TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:projectdiscovery/nuclei:pull" | jq -r .token)
          #   curl -sI -H "Authorization: Bearer $TOKEN" \
          #     -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
          #     https://registry-1.docker.io/v2/projectdiscovery/nuclei/manifests/v3.11.0 | grep -i docker-content-digest
          docker run --rm --network host -v "$PWD/tests/dynamic:/work" \
            projectdiscovery/nuclei:v3.11.0@sha256:e677842fb1f50f29747565ba274a1d35dcf8c684132a42b0cb406e71fccae9fc \
            -u http://127.0.0.1:8081 \
            -severity high,critical -ni -rl 80 -timeout 5 -retries 1 \
            "${EID_ARGS[@]}" \
            -jsonl -o /work/nuclei-findings.jsonl || true

          if [ -s tests/dynamic/nuclei-findings.jsonl ]; then
            echo "::error::nuclei reported high/critical findings on the admin plane:"
            cat tests/dynamic/nuclei-findings.jsonl
            exit 1
          fi
          echo "nuclei: no high/critical findings"

      - name: Gateway logs (always)
        if: always()
        run: cat gateway.log || true

      - name: Teardown
        if: always()
        run: |
          [ -n "${AEGIS_PID:-}" ] && kill "$AEGIS_PID" 2>/dev/null || true
          docker rm -f aegis-scan-redis aegis-scan-echo 2>/dev/null || true
